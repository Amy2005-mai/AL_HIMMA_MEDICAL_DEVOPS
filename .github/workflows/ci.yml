name: Laravel CI - Full Build

on:
  push:
    branches:
      - main
      - dev
      - feature/*
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      APP_ENV: testing
      APP_KEY: base64:4pL5eFqVtZ0w6zP+E1FvG8sX9aHkQnO+V3ZrR1x2yJ0=
      APP_DEBUG: true
      APP_URL: http://localhost
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installer PHP et extensions
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_sqlite, fileinfo
          ini-values: post_max_size=256M, max_execution_time=300

      # 3️⃣ Installer les dépendances Composer
      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-suggest

      # 4️⃣ Installer Node + Vite
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # 5️⃣ Créer les dossiers nécessaires et préparer Laravel
      - name: Prepare Laravel
        run: |
          mkdir -p storage/framework/testing
          chmod -R 777 storage

      # 6️⃣ Lancer les migrations AVANT tout clear
      - name: Run migrations
        run: php artisan migrate --force

      # 7️⃣ Clear caches (après migrations pour éviter les erreurs SQLite)
      - name: Clear caches
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan view:clear
          php artisan route:clear

      # 8️⃣ Lancer les tests
      - name: Run PHPUnit tests
        run: php artisan test --env=testing --colors