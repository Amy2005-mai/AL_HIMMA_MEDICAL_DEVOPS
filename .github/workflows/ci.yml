name: Laravel CI - Full Build

on:
  push:
    branches:
      - main
      - dev
      - feature/*
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      APP_ENV: testing
      APP_KEY: base64:SomeRandomKeyHere1234567890==
      APP_DEBUG: true
      APP_URL: http://localhost

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installer PHP et extensions
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_sqlite, fileinfo
          ini-values: post_max_size=256M, max_execution_time=300

      # 3️⃣ Installer Composer
      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-suggest

      # 4️⃣ Installer Node.js et dépendances
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets for production
        run: npm run build

      # 5️⃣ Créer le fichier SQLite avec chemin absolu
      - name: Create SQLite database file
        run: |
          mkdir -p $GITHUB_WORKSPACE/database
          touch $GITHUB_WORKSPACE/database/testing.sqlite
        shell: bash

      # 6️⃣ Définir DB_DATABASE absolu pour toutes les étapes Laravel
      - name: Set DB_DATABASE env
        run: echo "DB_DATABASE=$GITHUB_WORKSPACE/database/testing.sqlite" >> $GITHUB_ENV

      # 7️⃣ Préparer Laravel (vider caches)
      - name: Prepare Laravel
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan view:clear
          php artisan route:clear
          mkdir -p storage/framework/testing
          chmod -R 777 storage

      # 8️⃣ Lancer les migrations
      - name: Run migrations
        run: php artisan migrate --force

      # 9️⃣ Lancer les tests PHPUnit
      - name: Run PHPUnit tests
        run: php artisan test --env=testing --no-tty --colors