name: Laravel CI - Full Build

on:
  push:
    branches:
      - main
      - dev
      - feature/*
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      APP_ENV: testing
      APP_KEY: base64:4pL5eFqVtZ0w6zP+E1FvG8sX9aHkQnO+V3ZrR1x2yJ0=  # clé valide pour Laravel
      APP_DEBUG: true
      APP_URL: http://localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_sqlite, fileinfo
          ini-values: post_max_size=256M, max_execution_time=300

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-suggest

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare Laravel
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan view:clear
          php artisan route:clear
          mkdir -p storage/framework/testing
          chmod -R 777 storage

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --env=testing --colors